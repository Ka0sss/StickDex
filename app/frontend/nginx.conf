server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Health check del contenedor
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # API: se reenvía al backend manteniendo la ruta (/api/... → /api/...)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Las subidas de imágenes admiten hasta 5 MB (el límite de multer).
    client_max_body_size 6m;
  }

  # Imágenes subidas, servidas por el backend
  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # Aplicación de una sola página: cualquier ruta desconocida la resuelve React Router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
