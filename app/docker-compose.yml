services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stickdex}
      MYSQL_USER: ${MYSQL_USER:-stickdex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stickdex}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-stickdex}:${MYSQL_PASSWORD:-stickdex}@db:3306/${MYSQL_DATABASE:-stickdex}
      SESSION_SECRET: ${SESSION_SECRET:-cambiar-por-secreto-largo-de-32-caracteres}
      PORT: 3000
      # En producción, con HTTPS por delante, poner NODE_ENV=production (cookie `secure`)
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    volumes:
      # Carpeta compartida con el host: el seed y las subidas se ven igual desde ambos lados
      - ./backend/uploads:/app/uploads:z
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  db_data:
